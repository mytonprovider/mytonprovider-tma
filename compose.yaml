services:
  app:
    build:
      context: ./app
      args:
        VITE_TG_CLIENT_ID: ${TG_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8080}:8080"
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./app/backend/data:/backend/backend/data
      - ./.git:/backend/.git:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
